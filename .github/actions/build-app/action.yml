name: Build application

inputs:
  xpEnv:
    required: true
    description: XP environment name

runs:
  using: composite
  steps:
    - uses: navikt/navno-actions/setup-jvm@v1

    # Also installs dependencies with --frozen-lockfile
    - uses: navikt/navno-actions/setup-node-pnpm@v1

    - name: Run unit tests
      shell: bash
      run: pnpm --filter nav-enonicxp-unit-tests run test

    - name: Build application
      shell: bash
      run: ./gradlew build

    - name: Verify production package boundary
      shell: bash
      run: |
        entries="$(jar tf build/libs/navno.jar)"
        if grep -Eq '^(services/curatedExportImport/|lib/curated-export/target/|no/nav/navno/curatedexport/target/)' <<< "$entries"; then
          echo "Writable curated import helpers must not be packaged for deployment"
          exit 1
        fi

    - name: Build e2e test data
      shell: bash
      # The test data build reads the XP version from the root gradle.properties.
      run: ./gradlew build -p=test/e2e-tests/.xp-test-data-app
        # TODO: "Delete node_modules" and "Install production dependencies" steps were omitted.
        # This project builds JAR files (Enonic XP app), not a Node.js app. No node_modules are
        # copied into Docker images, and all Node.js dependencies are dev-only (build tools, testing).
        # If this changes, add steps to rm -rf node_modules and pnpm install --frozen-lockfile --prod.

    - name: Upload jar files
      uses: actions/upload-artifact@v7
      with:
        name: navno-jar-${{ inputs.xpEnv }}-${{ github.sha }}
        path: |
          build/libs/navno.jar
          test/e2e-tests/.xp-test-data-app/build/libs/navno-testdata.jar
        overwrite: 'true'
        retention-days: 1