name: Sandbox tooling
on:
  pull_request:
    paths:
      - 'scripts/sandbox/**'
      - 'eslint.config.mjs'
      - '.github/workflows/sandbox-tooling.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/sandbox/**'
      - 'eslint.config.mjs'
      - '.github/workflows/sandbox-tooling.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - uses: navikt/navno-actions/setup-node-pnpm@v1

      - name: Lint sandbox scripts
        run: pnpm run sandbox:lint

      - name: Run sandbox script tests
        run: pnpm run sandbox:test
