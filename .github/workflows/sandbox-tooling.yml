name: Sandbox tooling
on:
  pull_request:
    paths:
      - 'scripts/sandbox/**'
      - 'eslint.config.mjs'
      - '.github/workflows/sandbox-tooling.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/sandbox/**'
      - 'eslint.config.mjs'
      - '.github/workflows/sandbox-tooling.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install node.js dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint sandbox scripts
        run: pnpm run sandbox:lint

      - name: Run sandbox script tests
        run: pnpm run sandbox:test
