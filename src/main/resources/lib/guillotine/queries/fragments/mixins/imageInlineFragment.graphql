fragment imageInlineMixin on Content {
    type
    ... on media_Vector {
        mediaUrl(download: false) { path queryString }
    }
    ... on media_Image {
        mediaUrl(download: false) { path queryString }
        imageUrl(scale: "$scale") { path queryString }
        imageInfo {
            imageWidth
            imageHeight
            contentType
        }
    }
}
