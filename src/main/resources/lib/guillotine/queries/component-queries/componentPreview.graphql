#import "../fragments/components/allComponentsFragment.graphql"
#import "../fragments/contentCommonFragment.graphql"

# Components are filtered by path in runGuillotineComponentPreviewQuery, as the Guillotine app
# does not support filtering components by path
query componentPreviewQuery($ref: ID!) {
    guillotine {
        get(key: $ref) {
            components(resolveTemplate: false, resolveFragment: false) {
                ...allComponents
            }
        }
    }
}
