kind: "FormFragment"
title: "_TEMP_"
form:
  - type: "FieldSet"
    label: "Mellomsteg"
    items:
      - type: "FormFragment"
        name: "html-area"
      - type: "ItemSet"
        name: "steps"
        label: "Enkeltsteg"
        occurrences:
          min: 1
          max: 0
        items:
          - type: "FormFragment"
            name: "form-intermediate-step-data-meta"
          - type: "OptionSet"
            name: "nextStep"
            expanded: false
            label: "Dette valget sender brukeren videre til:"
            occurrences:
              min: 1
              max: 1
            options:
              - name: "internal"
                label: "Intern lenke til skjema, søknad eller klage"
                helpText: "Brukeren skal sendes til dokument som ligger på Enonic\
                  \ XP"
                items:
                  - type: "MediaSelector"
                    name: "internalContent"
                    label: "Internt innhold"
                    occurrences:
                      min: 1
                      max: 1
                    allowContentType:
                      - "media:document"
              - name: "external"
                label: "Ekstern lenke til skjema, søknad eller klage"
                helpText: "Brukeren skal sendes til en app eller tjeneste utenfor\
                  \ Enonic XP"
                items:
                  - type: "TextLine"
                    name: "formNumber"
                    label: "Skjemanummer"
                    occurrences:
                      min: 0
                      max: 1
                  - type: "TextLine"
                    name: "externalUrl"
                    label: "Ekstern URL"
                    occurrences:
                      min: 1
                      max: 1
                    regexp: "^https?:\\/\\/.*"
              - name: "next"
                label: "Nytt steg, nivå 2"
                helpText: "Brukeren skal sendes til et nytt steg for nye veivalg"
                items:
                  - type: "FieldSet"
                    label: "Enkeltsteg"
                    items:
                      - type: "ItemSet"
                        name: "steps"
                        label: "Steg"
                        occurrences:
                          min: 1
                          max: 0
                        items:
                          - type: "FormFragment"
                            name: "form-intermediate-step-data-meta"
                          - type: "OptionSet"
                            name: "nextStep"
                            expanded: false
                            label: "Dette valget sender brukeren\n               \
                              \                                                 videre\
                              \ til:"
                            occurrences:
                              min: 1
                              max: 1
                            options:
                              - name: "internal"
                                label: "Intern lenke til skjema, søknad eller klage"
                                helpText: "Brukeren skal sendes til dokument som ligger\
                                  \ på Enonic XP"
                                selected: true
                                items:
                                  - type: "MediaSelector"
                                    name: "internalContent"
                                    label: "Internt innhold"
                                    occurrences:
                                      min: 1
                                      max: 1
                                    allowContentType:
                                      - "\n                                      \
                                        \                                        \
                                        \      media:document"
                              - name: "external"
                                label: "Ekstern lenke til skjema, søknad eller klage"
                                helpText: "Brukeren skal sendes til en app eller tjeneste\
                                  \ utenfor Enonic XP"
                                items:
                                  - type: "TextLine"
                                    name: "formNumber"
                                    label: "Skjemanummer"
                                    occurrences:
                                      min: 0
                                      max: 1
                                  - type: "TextLine"
                                    name: "externalUrl"
                                    label: "Ekstern URL"
                                    occurrences:
                                      min: 1
                                      max: 1
                              - name: "next"
                                label: "Nytt steg, nivå 3"
                                items:
                                  - type: "FieldSet"
                                    label: "Enkeltsteg"
                                    items:
                                      - type: "ItemSet"
                                        name: "steps"
                                        label: "Steg"
                                        occurrences:
                                          min: 1
                                          max: 0
                                        items:
                                          - type: "FormFragment"
                                            name: "form-intermediate-step-data-meta"
                                          - type: "OptionSet"
                                            name: "nextStep"
                                            expanded: false
                                            label: "Dette\n                      \
                                              \                                  \
                                              \                                  \
                                              \      valget\n                    \
                                              \                                  \
                                              \                                  \
                                              \        sender\n                  \
                                              \                                  \
                                              \                                  \
                                              \          brukeren\n              \
                                              \                                  \
                                              \                                  \
                                              \              videre\n            \
                                              \                                  \
                                              \                                  \
                                              \                til:"
                                            occurrences:
                                              min: 1
                                              max: 1
                                            options:
                                              - name: "internal"
                                                label: "Intern lenke til skjema, sø\
                                                  knad eller klage"
                                                helpText: "Brukeren skal sendes til\
                                                  \ dokument som ligger på Enonic\
                                                  \ XP"
                                                items:
                                                  - type: "MediaSelector"
                                                    name: "internalContent"
                                                    label: "Internt innhold"
                                                    occurrences:
                                                      min: 1
                                                      max: 1
                                                    allowContentType:
                                                      - "\n                      \
                                                        \                        \
                                                        \                        \
                                                        \                        \
                                                        \                      media:document"
                                              - name: "external"
                                                label: "Ekstern lenke til skjema,\
                                                  \ søknad eller klage"
                                                helpText: "Brukeren skal sendes til\
                                                  \ en app eller tjeneste utenfor\
                                                  \ Enonic XP"
                                                items:
                                                  - type: "TextLine"
                                                    name: "formNumber"
                                                    label: "Skjemanummer"
                                                    occurrences:
                                                      min: 0
                                                      max: 1
                                                  - type: "TextLine"
                                                    name: "externalUrl"
                                                    label: "Ekstern URL"
                                                    occurrences:
                                                      min: 1
                                                      max: 1
                                            selection:
                                              min: 1
                                              max: 1
                            selection:
                              min: 1
                              max: 1
            selection:
              min: 1
              max: 1
