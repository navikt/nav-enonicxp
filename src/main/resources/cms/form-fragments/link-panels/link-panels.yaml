kind: "FormFragment"
title: "Lenkepaneler"
form:
  - type: "FieldSet"
    label: "Lenkepaneler"
    items:
      - type: "TextLine"
        name: "panelsHeading"
        label: "Overskrift over lenkepanelene"
        helpText: "\n                        Fylles ut hvis du vil ha en overskrift\
          \ over lenkepanelene.\n                    "
        occurrences:
          min: 0
          max: 1
      - type: "ItemSet"
        name: "panelItems"
        label: "Klikkbart lenkepanel"
        occurrences:
          min: 0
          max: 0
        items:
          - type: "TextLine"
            name: "title"
            label: "Paneltittel"
            occurrences:
              min: 1
              max: 1
          - type: "TextLine"
            name: "ingress"
            label: "Panelbeskrivelse"
            occurrences:
              min: 0
              max: 1
          - type: "ItemSet"
            name: "url"
            label: "Peker til innhold"
            occurrences:
              min: 1
              max: 1
            items:
              - type: "TextLine"
                name: "text"
                label: "URL til lenke"
                helpText: "\n                                        Legg url på formen\
                  \ https://*.nav.no/* - Hvis innhold velges under, vil dette overstyre\
                  \ url\n                                    "
                occurrences:
                  min: 0
                  max: 1
                regexp: "^https:\\/\\/([a-z0-9_\\-.]*\\.)?nav\\.no($|\\/).*"
              - type: "ContentSelector"
                name: "ref"
                label: "ELLER - Velg innhold"
                helpText: "\n                                        Vil overstyre\
                  \ eventuell url lagt inn over\n                                \
                  \    "
                occurrences:
                  min: 0
                  max: 1
