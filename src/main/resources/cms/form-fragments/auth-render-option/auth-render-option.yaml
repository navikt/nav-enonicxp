kind: "FormFragment"
title: "_TEMP_"
form:
  - type: "FieldSet"
    label: "Innloggings-avhengig visning"
    items:
      - type: "RadioButton"
        name: "renderOnAuthState"
        label: "Velg visning"
        helpText: "Velg om komponenten skal vises kun for innlogget eller uinnlogget\n\
          \                        bruker. Markeres med hhv grønt eller rødt omriss\
          \ (kun i editoren).\n                    "
        occurrences:
          min: 1
          max: 1
        options:
          - value: "always"
            label: "Vis for alle"
          - value: "loggedIn"
            label: "Vis kun for innlogget"
          - value: "loggedOut"
            label: "Vis kun for uinnlogget"
        default: "always"
