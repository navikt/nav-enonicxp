kind: "FormFragment"
title: "_TEMP_"
form:
  - type: "OptionSet"
    name: "link"
    expanded: true
    label: "Lenke til skjema"
    occurrences:
      min: 1
      max: 1
    options:
      - name: "internal"
        label: "Intern lenke til skjema/mellomsteg"
        items:
          - type: "ContentSelector"
            name: "target"
            label: "Velg skjema eller mellomsteg"
            occurrences:
              min: 1
              max: 1
            attributes:
              showStatus: "true"
            allowContentType:
              - "no.nav.navno:form-intermediate-step"
              - "media:document"
      - name: "external"
        label: "Ekstern lenke til skjema"
        items:
          - type: "TextLine"
            name: "formNumber"
            label: "Skjemanummer"
            occurrences:
              min: 0
              max: 1
          - type: "TextLine"
            name: "url"
            label: "URL"
            occurrences:
              min: 1
              max: 1
            regexp: "^https?:\\/\\/.*"
            default: "https://www.nav.no/"
    selection:
      min: 1
      max: 1
