kind: "ContentType"
superType: "base:structured"
final: true
allowChildContent: false
title: "Oversiktsside"
description: "Egen side med oversikt over søknadsfrister, satser etc"
form:
  - type: "FieldSet"
    label: "Sideoppsett"
    items:
      - type: "FormFragment"
        name: "page-header"
      - type: "FormFragment"
        name: "ingress-required"
      - type: "ComboBox"
        name: "audience"
        label: "Målgruppe"
        occurrences:
          min: 1
          max: 0
        options:
          - value: "person"
            label: "Privatperson"
          - value: "employer"
            label: "Arbeidsgiver"
          - value: "provider"
            label: "Samarbeidspartner"
      - type: "ComboBox"
        name: "overviewType"
        label: "Type oversiktsside"
        occurrences:
          min: 1
          max: 1
        options:
          - value: "rates"
            label: "Satser"
          - value: "payout_dates"
            label: "Utbetalingdatoer"
          - value: "processing_times"
            label: "Saksbehandlingstider"
          - value: "all_products"
            label: "Alle produkter"
  - type: "FieldSet"
    label: "Data for ikke-lokaliserte sider"
    items:
      - type: "ContentSelector"
        name: "localeFallback"
        label: "Velg fallback data"
        helpText: "Brukes for å sette inn elementer for sider som ikke er lokalisert"
        occurrences:
          min: 0
          max: 0
        attributes:
          showStatus: "true"
        allowContentType:
          - "${app}:content-data-locale-fallback"
  - type: "FieldSet"
    label: "Ekskluderte sider"
    items:
      - type: "CustomSelector"
        name: "excludedContent"
        label: "Velg innhold som ikke skal vises i denne oversikten"
        occurrences:
          min: 0
          max: 0
        service: "contentSelector"
        params:
          contentTypes: "\n                            [\"no.nav.navno:content-page-with-sidemenus\"\
            ,\"no.nav.navno:guide-page\",\"no.nav.navno:themed-article-page\"]\n \
            \                       "
          selectorQuery: "data.audience._selected IN ({data.audience,true})"
          sort: "data.area ASC, displayName ASC"
  - type: "FormFragment"
    name: "illustration"
  - type: "FormFragment"
    name: "custom-path-selector-required"
  - type: "FormFragment"
    name: "owner"
  - type: "FormFragment"
    name: "managed-by"
  - type: "FormFragment"
    name: "dynamic-page-common"
  - type: "TextLine"
    name: "allProducts"
    label: "(tomt felt, skal ikke brukes)"
    occurrences:
      min: 0
      max: 1
    regexp: "^$"
