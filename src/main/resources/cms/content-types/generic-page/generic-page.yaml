kind: "ContentType"
superType: "base:structured"
final: true
title: "Generisk side"
description: "Side med innholdsmeny som brukes til enkelstående sider. Skal brukes\
  \ unntaksvis."
form:
  - type: "FieldSet"
    label: "Tittel og ingress"
    items:
      - type: "FormFragment"
        name: "page-header"
      - type: "FormFragment"
        name: "ingress-required"
      - type: "CheckBox"
        name: "hideIngress"
        label: "Ikke vis ingress på selve siden"
        occurrences:
          min: 0
          max: 1
        default: "checked"
  - type: "FieldSet"
    label: "Generisk sidedata"
    items:
      - type: "FormFragment"
        name: "audience"
  - type: "FieldSet"
    label: "Piktogram"
    items:
      - type: "FormFragment"
        name: "illustration"
  - type: "FieldSet"
    label: "URL"
    items:
      - type: "FormFragment"
        name: "external-product-url"
      - type: "FormFragment"
        name: "custom-path-selector-required"
  - type: "FormFragment"
    name: "dynamic-page-common"
