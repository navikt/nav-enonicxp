kind: "ContentType"
superType: "base:structured"
final: true
title: "Mellomsteg for kontaktside"
form:
  - type: "FieldSet"
    label: "Overskrift og ingress"
    items:
      - type: "FormFragment"
        name: "header-with-parent"
      - type: "FormFragment"
        name: "html-area"
  - type: "FieldSet"
    label: "Kort-url"
    items:
      - type: "CustomSelector"
        name: "customPath"
        label: "Må begynne med '/start/[målgruppe dersom ikke privatperson]'"
        occurrences:
          min: 1
          max: 1
        service: "customPathSelector"
  - type: "FieldSet"
    label: "Lenker"
    items:
      - type: "ItemSet"
        name: "linkPanels"
        label: "Enkeltsteg"
        occurrences:
          min: 0
          max: 0
        items:
          - type: "FormFragment"
            name: "link-internal"
          - type: "TextArea"
            name: "ingress"
            label: "Ingress"
            occurrences:
              min: 0
              max: 1
  - type: "ItemSet"
    name: "backLink"
    label: "Tilbakelenke"
    occurrences:
      min: 0
      max: 1
    items:
      - type: "FormFragment"
        name: "link-internal"
