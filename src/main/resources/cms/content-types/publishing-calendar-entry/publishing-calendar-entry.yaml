kind: "ContentType"
superType: "base:unstructured"
title: "Kalenderhendelse"
description: "Statistikk for publisering"
form:
  - type: "FieldSet"
    label: "Kalenderhendelse"
    items:
      - type: "TextArea"
        name: "period"
        label: "Periode"
        occurrences:
          min: 1
          max: 1
      - type: "Date"
        name: "date"
        label: "Dato for publisering"
        occurrences:
          min: 1
          max: 1
      - type: "ContentSelector"
        name: "link"
        label: "Lenke til relevant innhold"
        occurrences:
          min: 0
          max: 1
        allowContentType:
          - "${app}:*"
