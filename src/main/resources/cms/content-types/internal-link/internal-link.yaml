kind: "ContentType"
superType: "base:unstructured"
title: "Intern Lenke"
description: "Lenker til innhold i Enonic XP"
form:
  - type: "TextArea"
    name: "description"
    label: "Beskrivelse"
    occurrences:
      min: 0
      max: 1
  - type: "ContentSelector"
    name: "target"
    label: "Lenke"
    occurrences:
      min: 0
      max: 1
    attributes:
      showStatus: "true"
    allowPath:
      - "/www.nav.no/*"
  - type: "TextLine"
    name: "anchorId"
    label: "Anker-id"
    helpText: "Sett denne for å lenke til en anker-id på siden. Må starte med #"
    occurrences:
      min: 0
      max: 1
    regexp: "^#.+"
  - type: "CheckBox"
    name: "redirectSubpaths"
    label: "Redirect alle url'er under denne til valgt link (unntatt url'er med publisert\
      \ innhold)"
    occurrences:
      min: 0
      max: 1
    default: "unchecked"
  - type: "FormFragment"
    name: "custom-path-selector"
  - type: "FormFragment"
    name: "type-of-redirect"
