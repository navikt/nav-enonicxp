kind: "Part"
title: "Header"
description: "H3 og H4-header"
form:
  - type: "TextLine"
    name: "title"
    label: "Tittel"
    occurrences:
      min: 1
      max: 1
    default: "Tittel"
  - type: "TextLine"
    name: "anchorId"
    label: "Anker-id"
    helpText: "\n                Sett et anker-id for å kunne lenke til denne delen\
      \ av siden\n                Eks: https://www.nav.no/no/min-side#mitt-anker\n\
      \                Dette feltet benyttes også av komponenten for intern-navigasjon\
      \ på siden\n            "
    occurrences:
      min: 0
      max: 1
    regexp: "^[0-9a-zA-Z-_]*$"
  - type: "RadioButton"
    name: "titleTag"
    label: "Heading tag"
    occurrences:
      min: 1
      max: 1
    options:
      - value: "h3"
        label: "H3"
      - value: "h4"
        label: "H4"
    default: "h3"
  - type: "FormFragment"
    name: "auth-render-option"
