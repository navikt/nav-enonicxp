kind: "Part"
title: "Situasjonskort"
description: "Lenker til en situasjons-side"
form:
  - type: "ContentSelector"
    name: "dummyTarget"
    label: "Situasjon (settes automatisk)"
    occurrences:
      min: 1
      max: 1
    allowContentType:
      - "${app}:situation-page"
  - type: "CheckBox"
    name: "disabled"
    label: "Skjul denne situasjonen"
    occurrences:
      min: 0
      max: 1
    default: "unchecked"
config:
  allowOnContentType: "${app}:area-page"
