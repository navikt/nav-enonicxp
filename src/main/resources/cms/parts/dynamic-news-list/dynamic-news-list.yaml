kind: "Part"
title: "Nyhetsliste"
form:
  - type: "TextLine"
    name: "title"
    label: "Tittel"
    occurrences:
      min: 0
      max: 1
    default: "Nyheter"
  - type: "CheckBox"
    name: "hideTitle"
    label: "Skjul tittel"
    occurrences:
      min: 0
      max: 1
    default: "unchecked"
  - type: "ItemSet"
    name: "contentList"
    label: "Innholdsliste for nyheter"
    occurrences:
      min: 1
      max: 1
    items:
      - type: "FormFragment"
        name: "content-list"
  - type: "ItemSet"
    name: "moreNews"
    label: "Flere nyheter"
    occurrences:
      min: 0
      max: 1
    items:
      - type: "TextLine"
        name: "url"
        label: "Lenke"
        occurrences:
          min: 1
          max: 1
        default: "/sok?f=1&s=1"
      - type: "TextLine"
        name: "text"
        label: "Lenketekst"
        occurrences:
          min: 1
          max: 1
        default: "Flere nyheter"
  - type: "FormFragment"
    name: "expandable"
  - type: "FormFragment"
    name: "auth-render-option"
