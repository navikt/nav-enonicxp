kind: "Layout"
title: "Fleksibelt kolonne-layout"
description: "Responsive flexbox-kolonner"
form:
  - type: "FormFragment"
    name: "header-with-anchor"
  - type: "Long"
    name: "numCols"
    label: "Antall kolonner ved full skjermbredde"
    occurrences:
      min: 0
      max: 1
    min: 1
    max: 3
    default: 3
  - type: "CheckBox"
    name: "collapse"
    label: "Fullstendige rader"
    helpText: "\n                Kollapser 3-kolonner til 2-kolonner dersom layoutet\
      \ inneholder et liketalls antall komponenter\n            "
    occurrences:
      min: 0
      max: 1
    default: "unchecked"
  - type: "RadioButton"
    name: "justifyContent"
    label: "Justering"
    helpText: "\n                Justering for ufullstendige rader\n            "
    occurrences:
      min: 0
      max: 1
    options:
      - value: "flex-start"
        label: "Venstre"
      - value: "center"
        label: "Midtstilt"
      - value: "flex-end"
        label: "Høyre"
    default: "flex-start"
  - type: "FormFragment"
    name: "layouts-common"
regions:
  - "flexcols"
config:
  allowOnContentType: "^(?!(${app}:situation-page)).+"
