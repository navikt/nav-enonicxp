kind: "Macro"
title: "Produkt-kort (mini)"
description: "Lenker til en produkt- eller livssituasjons-side"
form:
  - type: "ContentSelector"
    name: "targetPage"
    label: "Velg side"
    occurrences:
      min: 1
      max: 1
    allowContentType:
      - "${app}:content-page-with-sidemenus"
      - "${app}:situation-page"
      - "${app}:guide-page"
      - "${app}:tools-page"
      - "${app}:themed-article-page"
      - "${app}:overview"
      - "${app}:forms-overview"
      - "${app}:oversikt"
      - "${app}:generic-page"
