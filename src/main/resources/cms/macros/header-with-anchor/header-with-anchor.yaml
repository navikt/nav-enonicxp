kind: "Macro"
title: "Header med anker-id (H3/H4)"
description: "Header som kan lenkes til med hash/anker-id, f.eks nav.no/no/min-side#mitt-anker-id"
form:
  - type: "TextLine"
    name: "body"
    label: "Tekst"
    occurrences:
      min: 1
      max: 1
  - type: "TextLine"
    name: "id"
    label: "Anker-id"
    occurrences:
      min: 1
      max: 1
  - type: "RadioButton"
    name: "tag"
    label: "Header tag"
    occurrences:
      min: 1
      max: 1
    options:
      - value: "h3"
        label: "H3"
      - value: "h4"
        label: "H4"
    default: "h3"
  - type: "TextLine"
    name: "text"
    label: "(Deprecated - Bruk \"Tekst\" feltet)"
    occurrences:
      min: 0
      max: 1
    regexp: "^$"
