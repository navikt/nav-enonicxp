kind: "Macro"
title: "Lenke til telefonnummer"
form:
  - type: "TextLine"
    name: "text"
    label: "Lenketekst"
    occurrences:
      min: 1
      max: 1
  - type: "TextLine"
    name: "phoneNumber"
    label: "Telefonnummer"
    occurrences:
      min: 1
      max: 1
    regexp: "^(\\+?[0-9]+)$"
  - type: "CheckBox"
    name: "chevron"
    label: "Lenke med chevron"
    occurrences:
      min: 1
      max: 1
