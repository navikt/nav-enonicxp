kind: "Macro"
title: "Video"
description: "Legg inn URL og beskrivende tittel"
form:
  - type: "ContentSelector"
    name: "targetContent"
    label: "Velg video-innhold"
    occurrences:
      min: 1
      max: 1
    allowContentType:
      - "${app}:video"
  - type: "TextLine"
    name: "language"
    label: "Overstyr språk for undertekster"
    helpText: "To-bokstavers kode, f.eks. \"nb\" eller \"en\". Som standard benyttes\
      \ samme språk som på siden.\n            "
    occurrences:
      min: 0
      max: 1
    regexp: "^[a-z]{2}$"
  - type: "TextLine"
    name: "title"
    label: "(Ikke i bruk)"
    helpText: "Beskrivende tittel for gamle videoer - skal ikke brukes"
    occurrences:
      min: 0
      max: 1
  - type: "TextLine"
    name: "video"
    label: "(Ikke i bruk)"
    helpText: "URL til video for gamle videoer - skal ikke brukes"
    occurrences:
      min: 0
      max: 1
    regexp: "^https:\\/\\/video\\.qbrick\\.com\\/.+"
