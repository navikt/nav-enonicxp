kind: "Macro"
title: "Skjemadetaljer"
description: "Viser valgte skjemadetaljer"
form:
  - type: "CustomSelector"
    name: "targetFormDetails"
    label: "Velg skjemadetalj"
    helpText: "Husk å markere hvilke skjemadetaljer som skal være tilgjengelige på\
      \ denne siden. Det gjør du i produktside-fanen til venstre.\""
    occurrences:
      min: 1
      max: 1
    service: "selectedFormDetails"
  - type: "FieldSet"
    label: "Tilpass visning"
    items:
      - type: "CheckBox"
        name: "showTitle"
        label: "Vis tittel"
        occurrences:
          min: 0
          max: 1
        default: "checked"
      - type: "CheckBox"
        name: "showIngress"
        label: "Vis ingress"
        occurrences:
          min: 0
          max: 1
        default: "checked"
      - type: "CheckBox"
        name: "showApplications"
        label: "Vis inngang til søknad"
        occurrences:
          min: 0
          max: 1
        default: "checked"
      - type: "CheckBox"
        name: "showAddendums"
        label: "Vis inngang til ettersendelse"
        occurrences:
          min: 0
          max: 1
        default: "checked"
