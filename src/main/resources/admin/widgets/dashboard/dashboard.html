<widget >
	<style>
		#admin-widget {
			max-width: 45rem;
			line-height: 1.5;
			background-color: white;
			padding: 1rem;
			align-items: center;
			font-size: 1rem;

			details {
				*, :before, :after {
					box-sizing: border-box;
				}
				.icon-wrapper {
					width: 22px;
					height: 22px;
					align-self: center;
				}
				.chevron {
					height: inherit;
					width: inherit;
					flex-shrink: 0;
					transition: transform .25s cubic-bezier(.2, 0, 0, 1);
				}
			}
			details[open] summary {
				.chevron {
					transform: rotateX(-180deg)
				}
			}
			summary {
				cursor: pointer;
				justify-content: flex-start;
				align-items: flex-start;
				gap: 0.75rem;
				width: 100%;
				padding-bottom: 0.5rem;
				text-align: left;
				display: flex;
				position: relative;
			}
			summary::before, summary::after {
				content: "";
				background-color: gray;
				width: 100%;
				height: 1px;
				display: block;
				position: absolute;
				top: 0;
				left: 0;
				right: 0;
			}

			h1, h2, h3, h4 {
				line-height: 1.33;
			}
			h1 {
				margin-top: 0;
				margin-bottom: 1.5rem;
				font-size: 2rem;
			}
			h2 {
				font-size: 1.5rem;
			}
			h3 {
				font-size: 1.25rem;
			}
			h4 {
				font-size: 1rem;
			}
			section {
				margin-top: 1rem;
			}
		}
	</style>

	<div id="admin-widget">
		<h1 th:text="${displayName}"></h1>
		<section th:utext="${text}"></section>
		<section th:if="${subSections}">
			<details th:each="subSection: ${subSections}">
				<summary>
					<span class="icon-wrapper">
						<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="none" viewBox="0 0 24 24" focusable="false" role="img" class="chevron" aria-hidden="true">
							<path fill="currentColor" fill-rule="evenodd" d="M5.97 9.47a.75.75 0 0 1 1.06 0L12 14.44l4.97-4.97a.75.75 0 1 1 1.06 1.06l-5.5 5.5a.75.75 0 0 1-1.06 0l-5.5-5.5a.75.75 0 0 1 0-1.06" clip-rule="evenodd"></path>
						</svg>
					</span>
					<h3 th:text="${subSection.displayName}"></h3>
				</summary>
				<div th:utext="${subSection.data.text}"></div>
				<div th:utext="${subSection.data.subText}"></div>
			</details>
		</section>
		<section th:utext="${subText}"></section>
	</div>
</widget>
