gradle.projectsEvaluated {
    rootProject.tasks.register('curatedReaderNullRegression', JavaExec) {
        dependsOn rootProject.tasks.named('compileJava')
        def distribution = rootProject.findProperty('xpDistribution')
        classpath = rootProject.configurations.runtimeClasspath +
            rootProject.files(rootProject.layout.buildDirectory.dir('classes/java/main'))
        if (distribution) {
            classpath += rootProject.fileTree(distribution) {
                include 'system/**/*.jar', 'mods/*.jar'
            }
        }
        mainClass = rootProject.file('test/curated-target-java/CuratedNodeReaderNullRegression.java').absolutePath
        doFirst {
            if (!distribution) {
                throw new GradleException('Specify -PxpDistribution=<installed XP7 distribution> for the real Nashorn regression')
            }
        }
    }
    rootProject.tasks.register('curatedTemporalRegression', JavaExec) {
        dependsOn rootProject.tasks.named('compileJava')
        classpath = rootProject.configurations.runtimeClasspath +
            rootProject.files(rootProject.layout.buildDirectory.dir('classes/java/main'))
        mainClass = rootProject.file('test/curated-target-java/CuratedNodeRepairTemporalRegression.java').absolutePath
        def workDirectory = rootProject.layout.buildDirectory.dir('curated-temporal-regression').get().asFile
        systemProperty 'java.io.tmpdir', workDirectory.absolutePath
        doFirst {
            workDirectory.mkdirs()
        }
    }
}
