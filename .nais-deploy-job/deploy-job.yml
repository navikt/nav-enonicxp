apiVersion: nais.io/v1
kind: Naisjob
metadata:
  name: xp-navno-deploy-{{ xpEnv }}
  namespace: personbruker
  labels:
    team: personbruker
spec:
  image: {{ image }}
  # Retain the finished Job and its pod for 1 hour (also on failure) so the
  # deploy.js output can be inspected via `kubectl logs` after a failed install.
  ttlSecondsAfterFinished: 3600
  env:
    - name: XP_INSTALL_API
      value: "https://{{ xpAdminHost }}{{ xpDeployEndpoint }}"
  envFrom:
    - secret: {{ deploySecretName }}
  observability:
    logging:
      destinations:
        - id: elastic
        - id: loki
  accessPolicy:
    outbound:
      external:
        - host: {{ xpAdminHost }}
