apiVersion: nais.io/v1
kind: Naisjob
metadata:
  name: xp-navno-deploy-{{ xpEnv }}
  namespace: personbruker
  labels:
    team: personbruker
spec:
  image: {{ image }}
  env:
    - name: XP_INSTALL_API
      value: "https://{{ xpAdminHost }}{{ xpDeployEndpoint }}"
  envFrom:
    - secret: {{ deploySecretName }}
  observability:
    logging:
      destinations:
        - id: elastic
        - id: loki
  accessPolicy:
    outbound:
      external:
        - host: {{ xpAdminHost }}
